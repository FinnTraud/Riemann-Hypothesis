name = "rh"
defaultTargets = ["RH"]

# Mathlib is required for the formal RH statement (riemannZeta).
# On the first `lake build`, Lake downloads mathlib (a multi-GB cache) — only run it
# where network access to releases.lean-lang.org / GitHub is allowed.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"

[[lean_lib]]
name = "RH"
